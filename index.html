<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HIP Engineering</title>
  <meta name="description" content="HIP Engineering — site în lucru. Website under construction.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3d5e'/%3E%3Cpath d='M18 4 9 18h6l-2 10 9-14h-6z' fill='%23f5b301'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f6f7f9;
      --fg: #14202b;
      --muted: #5b6b7a;
      --accent: #f5b301;
      --brand: #0f3d5e;
      --line: #d9dee4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d151c;
        --fg: #e8edf2;
        --muted: #8fa1b2;
        --brand: #7fb8e0;
        --line: #22303c;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 20px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.02em;
      color: var(--brand);
      margin-bottom: 56px;
    }
    .logo svg { width: 36px; height: 36px; flex: none; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 20px;
    }
    .badge::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .badge::before { animation: none; } }
    h1 {
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }
    .lead { font-size: 1.125rem; color: var(--muted); max-width: 56ch; }
    .en { margin-top: 12px; font-size: 0.95rem; color: var(--muted); font-style: italic; }
    .progress {
      margin-top: 40px;
      height: 4px;
      background: var(--line);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress span {
      display: block;
      height: 100%;
      width: 35%;
      background: var(--accent);
      border-radius: 2px;
    }
    footer {
      border-top: 1px solid var(--line);
      padding: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#0f3d5e"/><path d="M18 4 9 18h6l-2 10 9-14h-6z" fill="#f5b301"/></svg>
      HIP Engineering
    </div>

    <span class="badge">În lucru</span>
    <h1>Site-ul nostru nou este în construcție.</h1>
    <p class="lead">Lucrăm la o prezentare completă a serviciilor noastre de inginerie. Revenim în curând.</p>
    <p class="en">Our new website is under construction. Please check back soon.</p>

    <div class="progress" role="presentation"><span></span></div>
  </main>

  <footer>
    &copy; <span id="year">2026</span> HIP Engineering
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
